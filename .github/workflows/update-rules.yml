name: Update Stash, Shadowrocket and Happ rules

on:
  push:
    paths:
      - .github/workflows/update-rules.yml
      - scripts/**
      - data/public_suffix_list.dat
      - shadowrocket.template.conf
      - shadowrocket.conf
      - rules/**
      - happ/**
      - stash/**
  pull_request:
    paths:
      - .github/workflows/update-rules.yml
      - scripts/**
      - data/public_suffix_list.dat
      - shadowrocket.template.conf
      - shadowrocket.conf
      - rules/**
      - happ/**
      - stash/**
      - examples/macos-resolver/**
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Показать версии toolchain
        run: |
          java -version
          kotlinc -version

      - name: Сгенерировать и проверить правила
        run: kotlinc -script scripts/generate.main.kts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Сгенерировать правила Stash
        run: kotlinc -script scripts/generate-stash.main.kts

      - name: Проверить маршруты
        run: kotlinc -script scripts/verify-routing.main.kts

      - name: Проверить служебные файлы
        run: |
          test -s shadowrocket.conf
          test -s happ/happ-routing.json
          test -s happ/happ-routing-link.txt
          test -s happ/geosite.dat
          test -s happ/geoip.dat
          test -s stash/routing.stoverride
          test -s examples/macos-resolver/mdb.yandexcloud.net.example
          grep -Fxq 'nameserver VPC_DNS_IP_1' examples/macos-resolver/mdb.yandexcloud.net.example
          ! grep -Eq 'hydraponique|zeklop|\{\{' shadowrocket.conf
          ! grep '^always-real-ip = ' shadowrocket.conf | grep -Fq 'yandexcloud.net'

      - name: Проверить формат изменений
        run: git diff --check

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Показать версии toolchain
        run: |
          java -version
          kotlinc -version

      - name: Сгенерировать и проверить правила
        run: kotlinc -script scripts/generate.main.kts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Сгенерировать правила Stash
        run: kotlinc -script scripts/generate-stash.main.kts

      - name: Проверить маршруты
        run: kotlinc -script scripts/verify-routing.main.kts

      - name: Проверить формат изменений
        run: git diff --check

      - name: Опубликовать изменения
        run: |
          if ! git status --porcelain -- rules shadowrocket.conf happ stash | grep -q .; then
            echo "Правила не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules shadowrocket.conf happ stash
          git commit -m "Обновить профили Stash, Shadowrocket и Happ"
          git push
