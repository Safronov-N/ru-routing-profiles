name: Bootstrap independent routing artifacts

on:
  push:
    branches:
      - publish-independent-routing-20261027

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/publish-independent-routing-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Сгенерировать правила
        run: kotlinc -script scripts/generate.main.kts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Проверить маршруты
        run: kotlinc -script scripts/verify-routing.main.kts

      - name: Добавить созданные файлы в ветку
        run: |
          git add -A -- rules happ shadowrocket.conf
          if git diff --cached --quiet; then
            echo "Правила не изменились"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Собрать независимые профили маршрутизации"
          git push origin HEAD:publish-independent-routing-20261027
