# NAME: Independent RU Routing for Shadowrocket
# Источники правил проверяются и обновляются генератором каждые 6 часов.
# Файл генерируется из shadowrocket.template.conf; ручные изменения будут перезаписаны.

[General]
bypass-system = true
skip-proxy = 127.0.0.1, 192.168.0.0/16, 10.0.0.0/8, 100.64.0.0/10, 172.16.0.0/12, localhost, *.local, captive.apple.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
# Публичный DNS обслуживает общий профиль. Private MDB требует split-DNS NetBird или macOS.
dns-server = tls://common.dot.dns.yandex.net
fallback-dns-server = https://dns.google/dns-query#proxy, https://cloudflare-dns.com/dns-query#proxy, system
dns-direct-system = false
# Ошибка DIRECT-DNS не должна отправлять private hostname публичному/proxy resolver.
dns-direct-fallback-proxy = false
ipv6 = false
# Разрешать частные адреса в DNS-ответах для локальных сетей и параллельных VPN.
private-ip-answer = true
# Полный TUN сохраняет доменную маршрутизацию Shadowrocket.
compatibility-mode = 3
hijack-dns = :53
allow-dns-all = true
update-url = https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/shadowrocket.conf

[Rule]
# Локальные сети.
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve

# ============================================================
# DOMAIN PHASE
# Сначала проверяются все доменные правила, затем IP.
# ============================================================

# Проверки внешнего IP всегда показывают адрес прокси.
DOMAIN-SUFFIX,2ip.ru,PROXY
DOMAIN-SUFFIX,2ip.io,PROXY
DOMAIN-SUFFIX,ipify.org,PROXY
DOMAIN-SUFFIX,ifconfig.me,PROXY
DOMAIN-SUFFIX,ip.sb,PROXY
DOMAIN-SUFFIX,checkip.amazonaws.com,PROXY
DOMAIN-SUFFIX,ipapi.is,PROXY
DOMAIN-SUFFIX,iplocate.io,PROXY
DOMAIN-SUFFIX,showip.net,PROXY

# Проксируемые сервисы из поддерживаемых доменных категорий.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/PROXY_DOMAIN.list,PROXY

# Важные российские сервисы должны работать напрямую даже при ошибке общего списка.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/DIRECT_PRIORITY_DOMAIN.list,DIRECT

# Небольшой проверенный список сообщества включает исключения и для национальных зон.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/PROXY_REFILTER_COMMUNITY.list,PROXY

# Национальные зоны остаются прямыми, если не перечислены выше явно.
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT
DOMAIN-SUFFIX,su,DIRECT
DOMAIN-SUFFIX,by,DIRECT

# Расширенный проверенный список блокировок содержит только прочие зоны.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/PROXY_REFILTER_DOMAIN.list,PROXY

# Российские сервисы из поддерживаемых доменных категорий.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/DIRECT_DOMAIN.list,DIRECT

# Зарубежные сервисы, которые обычно работают напрямую из РФ.
# Правила стоят после Re-filter: отдельно заблокированные адреса остаются PROXY.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/DIRECT_FOREIGN_DOMAIN.list,DIRECT

# ============================================================
# IP PHASE
# Только если ни одно DOMAIN-правило выше не совпало,
# Shadowrocket резолвит hostname и проверяет полученный IP.
# ============================================================

# Российские IP из независимой GeoIP-базы.
RULE-SET,https://raw.githubusercontent.com/Safronov-N/shadowrocket-roscomvpn-routing/main/rules/DIRECT_IP.list,DIRECT

# GeoLite2 используется только как последний DIRECT-fallback для российских IP.
GEOIP,RU,DIRECT

FINAL,PROXY
